name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set paths
        run: |
          "CONDA_PKGS_DIRS=$env:RUNNER_TEMP/conda-pkgs" >> $env:GITHUB_ENV
          "THUMBGEN_SDK_PREFIX=$env:RUNNER_TEMP/thumbgen-sdk/Library" >> $env:GITHUB_ENV
          "THUMBGEN_TEST_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      # Cache archives only. Every run recreates and verifies the SDK prefix.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/conda-pkgs/*.conda
            ${{ runner.temp }}/conda-pkgs/*.tar.bz2
          key: windows-sdk-archives-v2-${{ hashFiles('dependencies/windows-sdk.explicit.txt') }}
      - name: Restore locked SDK
        run: |
          New-Item -ItemType Directory -Force build/ci | Out-Null
          $condaExe = Join-Path $env:CONDA 'Scripts/conda.exe'
          if (!(Test-Path -LiteralPath $condaExe)) { throw 'Hosted runner Conda is unavailable' }
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP/thumbgen-sdk") { throw 'SDK prefix must be fresh' }
          & $condaExe create --yes --copy --prefix "$env:RUNNER_TEMP/thumbgen-sdk" --file dependencies/windows-sdk.explicit.txt 2>&1 | Tee-Object build/ci/sdk-restore.log
          if ($LASTEXITCODE -ne 0) { throw 'Conda SDK restore failed' }
          python scripts/verify-sdk.py --prefix "$env:RUNNER_TEMP/thumbgen-sdk" --archives "$env:CONDA_PKGS_DIRS" --receipt build/ci/sdk.json 2>&1 | Tee-Object build/ci/sdk-verify.log
          if ($LASTEXITCODE -ne 0) { throw 'SDK lock or archive verification failed' }
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt 2>&1 | Tee-Object build/ci/test-dependencies.log
      - name: Check CI audits
        run: python -m unittest discover -s tests/ci -v 2>&1 | Tee-Object build/ci/audits.log
      - name: Build and audit all current tests and product targets
        run: python scripts/ci/run.py --platform windows
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/ci/*.json
            build/ci/*.log
            build/ci/windows/*.json
            build/ci/windows/*.log
            build/ci/windows/public-smoke/*.json
            build/ci/windows/public-smoke/*.log
            build/ci/windows/public-smoke/fixture-build/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/windows/negative-*/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-dev/ci-tests.xml
            build/windows-dev/CMakeCache.txt
            build/windows-dev/Testing/Temporary/
            build/windows-dev/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-release/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-release/CMakeCache.txt
            build/windows-release/.cmake/api/v1/reply/
