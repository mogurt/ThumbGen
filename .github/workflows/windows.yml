name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set paths
        run: |
          "CONDA_PKGS_DIRS=$env:RUNNER_TEMP/conda-pkgs" >> $env:GITHUB_ENV
          "THUMBGEN_SDK_PREFIX=$env:RUNNER_TEMP/thumbgen-sdk/Library" >> $env:GITHUB_ENV
          "THUMBGEN_TEST_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      # Cache archives only. Every run recreates and verifies the SDK prefix.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/conda-pkgs
          key: windows-sdk-archives-v1-${{ hashFiles('dependencies/windows-sdk.explicit.txt') }}
      - name: Restore locked SDK
        run: |
          $condaExe = Join-Path $env:CONDA 'Scripts/conda.exe'
          if (!(Test-Path -LiteralPath $condaExe)) { throw 'Hosted runner Conda is unavailable' }
          & $condaExe create --yes --copy --prefix "$env:RUNNER_TEMP/thumbgen-sdk" --file dependencies/windows-sdk.explicit.txt
          if ($LASTEXITCODE -ne 0) { throw 'Conda SDK restore failed' }
          python scripts/verify-sdk.py --prefix "$env:RUNNER_TEMP/thumbgen-sdk" --archives "$env:CONDA_PKGS_DIRS" --receipt build/ci/sdk.json
          if ($LASTEXITCODE -ne 0) { throw 'SDK lock or archive verification failed' }
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Configure development build
        run: cmake --preset windows-dev
      - name: Build development targets
        run: cmake --build --preset windows-dev
      - name: Test synthetic images, protocol, scheduler and real signals
        env:
          OCIO: intentionally-invalid-parent-config.ocio
        run: ctest --preset windows-dev --output-junit ci-tests.xml
      - name: Configure product without test Python
        run: |
          Remove-Item Env:THUMBGEN_TEST_PYTHON
          cmake --preset windows-release
      - name: Build product
        run: cmake --build --preset windows-release
      - name: Read product identity
        run: |
          $env:PATH = "$env:THUMBGEN_SDK_PREFIX/bin;" + $env:PATH
          & ./build/windows-release/Release/thumbgen.exe --version --json
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/ci/sdk.json
            build/windows-dev/ci-tests.xml
            build/windows-dev/Testing/Temporary/
            build/windows-dev/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-release/CMakeFiles/CMakeConfigureLog.yaml
